[tool.poetry]
name = "fairdata-sso"
version = "1"
description = "Fairdata SSO"
authors = ["Fairdata Developers <fairdata-dev@listat.csc.fi>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
amqp = "5.3.1"
billiard = "4.2.2"
blinker = "1.9.0"
celery = "5.5.3"
certifi = "2025.10.5"
cffi = "2.0.0"
charset-normalizer = "3.4.4"
click = "8.3.0"
click-didyoumean = "0.3.1"
click-plugins = "1.1.1.2"
click-repl = "0.3.0"
colorama = "0.4.6"
cryptography = "46.0.3"
flask = "3.1.2"
flask-seasurf = "2.0.0"
flask-talisman = "1.1.0"
gunicorn = "23.0.0"
idna = "3.11"
importlib-metadata = "8.7.0"
isodate = "0.7.2"
itsdangerous = "2.2.0"
jinja2 = "3.1.6"
kombu = "5.5.4"
ldap3 = "2.9.1"
lxml = "6.0.2"
markupsafe = "3.0.3"
packaging = "25.0"
prompt-toolkit = "3.0.52"
psutil = "7.1.0"
psycopg2-binary = "2.9.11"
pyasn1 = "0.6.1"
pycparser = "2.23"
pyjwt = "2.10.1"
pyopenssl = "25.3.0"
python-dateutil = "2.9.0.post0"
python3-saml = "1.16.0"
pyyaml = "6.0.3"
requests = "2.32.5"
responses = "0.25.8"
setuptools = "80.9.0"
six = "1.17.0"
typing-extensions = "4.15.0"
tzdata = "2025.2"
urllib3 = "2.5.0"
validators = "0.35.0"
vine = "5.1.0"
wcwidth = "0.2.14"
werkzeug = "3.1.3"
xmlsec = "1.3.16"
zipp = "3.23.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

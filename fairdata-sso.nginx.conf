server {

    server_name  sso.fd-dev.csc.fi;

    listen       4443 ssl http2;
    listen       [::]:4443 ssl http2;

    root         /dev/null;

    error_log    /var/log/fairdata-sso/fairdata-sso.nginx.error.log warn;
    access_log   /var/log/fairdata-sso/fairdata-sso.nginx.access.log;

    proxy_buffers                4 256k;
    proxy_buffer_size            256k;
    proxy_busy_buffers_size      256k;
    proxy_cache                  off;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header 'Cache-Control' 'no-store';

    # Serve the fdwe.js file directly from /usr/local/fd/fairdata-metrics
    location = /fdwe.js {
        alias /usr/local/fd/fairdata-metrics/fdwe.js;
        add_header Content-Type application/javascript;
    }

    location / {
        proxy_pass http://unix:/run/fairdata-sso.sock;
    }

    server_tokens off;
}

